"OER_Agent":
  "arXiv_search": "Perform an arXiv search for papers with a given arxiv_search_query and context and provide a summary."
  "wait_for_update": "Pause execution and periodically check the HPC job queue until at least one job completes\nor fails, or until the timeout (`patience` minutes) is reached.\n\nOnly call this tool after checking the EXPLOG and confirming there is nothing productive\nto do while waiting. The tool will refuse to wait if no jobs are currently pending or running.\n\nReturns a message listing which process IDs changed status (completed or failed) during\nthe wait, along with the time waited and total time elapsed. If the timeout is reached\nwith no updates, returns a timeout message prompting further action."
  "query_explog": "Query the experiment log (EXPLOG) with optional filter and sort criteria. Automatically\nfetches the latest job updates before returning. Returns the filtered table as a string with row index.\n\ncandidates table contains:\n    candidate_id (str, MaterialID of the candidate),\n    \"Reduced Formula\" (str, the AQ-GNoME field of the same name for this candidate -- stored under this exact name, matching OER_data_analasis_v2/browse_df; <NA> only in the rare case the candidate can no longer be found in the AQ-GNoME database),\n    reason_or_hypothesis (str, for selecting the candidate),\n    notes (str, any notes you've added for the candidate),\n    G(O) deviation (Float64, deviation of best available G(O) from ideal 2.46 eV),\n    Overpotential_from_scaling (Float64, best available overpotential from OH-OOH scaling relation),\n    idealOverPotential (Float64, best available ideal overpotential across all studied sites),\n    state (str, 'active' or 'failed'; 'failed' means the candidate is dead and should be skipped: either all of its bulk relaxations failed, or no valid surface could be generated from its relaxed bulk. Once 'failed' it stays 'failed'),\n    decision (str, the candidate's CURRENT disposition tag -- one of Abandon, Low priority, Medium priority, High priority, Sufficient. \"Abandon\"/\"Sufficient\" are TERMINAL (stop, no more compute); the three priorities mean \"keep working, at this priority\". <NA> until the candidate is first dispositioned. Filter e.g. decision == \"High priority\" or decision == \"Abandon\"),\n    needs_disposition_update (boolean, True when the candidate has finished results not yet analyzed/dispositioned; these must be cleared before you may wait),\n    per-stage progress counters (Int64): started = work initiated; finalized = terminal/done and no longer running, FAILURES INCLUDED (so in-flight = started - finalized). A counter is <NA> when the candidate is NOT YET ELIGIBLE for that stage. Hence the filter idiom \"n_X_started == 0\" returns exactly the candidates READY to begin stage X. Counts are per LOGICAL UNIT, not per raw DFT sub-job:\n        n_bulk_started, n_bulk_finalized (0 or 1: ONE bulk relaxation per candidate, even though it runs several magnetic sub-jobs internally),\n        n_surface_started, n_surface_finalized (per surface termination; one DFT job each),\n        n_O_started, n_O_finalized (per adsorption site; one DFT job each),\n        n_OH_started, n_OH_finalized (per adsorption SITE, NOT per sub-job: each OH site runs 3 sub-jobs that collapse to one unit),\n    material-property columns from the AQ-GNoME database: only present when requested via include_material_properties, or transiently joined and filtered/sorted on when referenced by filters/sort even if that flag is False. Field semantics match the AQ-GNoME dataset fields already used by OER_data_analasis_v2:\n        Elements (List[str], unique chemical element symbols in the material -- use this to filter candidates by composition, e.g. contains_any=[\"Ru\"] or contains_all=[\"Ru\", \"O\"]),\n        Crystal System (str, e.g. cubic, tetragonal, orthorhombic, hexagonal, trigonal, monoclinic, triclinic),\n        Bandgap (Float64, PBE+U-level bandgap in eV; NaN if not available),\n        Disorder Probability (Float64, predicted probability of crystallographic substitutional disorder, 0 = 0% to 1 = 100%),\n        average_HHI_P, average_HHI_R (Int64, average Herfindahl-Hirschman Index across all elements in the material, for production/reserve concentration respectively -- higher means more geographically concentrated supply, a proxy for availability/cost risk),\n        average_HHI_P_excluding_O_H, average_HHI_R_excluding_O_H (Int64, same as above but excluding O and H from the average),\n        max_HHI_P, max_HHI_R (Int64, the single highest-HHI element in the material, production/reserve respectively),\n        max_dG_U[1.2,2.0]_pH0 (Float64, maximum (worst-case) Pourbaix decomposition energy in eV/atom across pH=0 and U in [1.2, 2.0] V vs SHE, using mixed GGA/GGA(+U)/r2SCAN stability data with the solid filter enabled. A value of 0.0 eV/atom means the material is the most stable known phase under these conditions; larger positive values indicate increasing tendency to decompose into more stable phases)\nprocesses table contains:\n    process_id (str, unique id for each process),\n    candidate_id (str, MaterialID of the candidate this process belongs to),\n    job_type (str, type of the DFT calculation, either bulk_relaxation, surface_relaxation, O_adsorption, or OH_adsorption),\n    slurmID (str, the slurm ID of the job, int in str format. NaN for un-submitted jobs),\n    status (str, current status of the job, either un-submitted, submitted, pending, running, completed, or failed),\n    termination_index (Int64, termination index for surface relaxation and adsorption calculations, NaN for bulk relaxation),\n    site_index (Int64, adsorption site index for adsorption calculations, NaN for bulk and surface relaxation),\n    processNote (str, any note you've left for this process),\n    G(O) (Float64, adsorption free energy of O* at this site in eV, NaN until O_adsorption job completes),\n    G(O) deviation (Float64, absolute deviation of G(O) from ideal 2.46 eV),\n    G(OH) (Float64, adsorption free energy of OH* at this site in eV, NaN until OH_adsorption job completes),\n    G(OH) deviation (Float64, absolute deviation of G(OH) from ideal 1.23 eV),\n    G(OOH) from scaling relation (Float64, G(OOH) = G(OH) + 3.2 eV),\n    G(OOH, scaling) deviation (Float64, absolute deviation of G(OOH) from ideal 3.69 eV),\n    ideal overpotential (Float64, best-case overpotential assuming optimal G(OOH), NaN until both G(O) and G(OH) are available),\n    overpotential from OH-OOH scaling relation (Float64, overpotential using G(OOH) = G(OH) + 3.2 eV)\n\nstart_idx (int, default 0): row index to start reading from (inclusive), always returns up to 50 rows. A footer shows the range and suggests the next start_idx when more rows remain.\nhide_redundant_oh (bool, default True): for the processes table, reduces each per-site OH adsorption group to the single row with the final G(OH) value. Groups with no G(OH) value are kept in full.\ninclude_material_properties (bool, default False): only affects the candidates table. When True, also returns the AQ-GNoME material-property columns listed above (including max_dG_U[1.2,2.0]_pH0), appended after the existing columns. You do NOT need to set this to True just to filter or sort by one of these columns -- the tool detects that automatically, joins the column(s) in to apply the filter/sort, then drops them again unless this flag is also True."
  "read_explog": "Get a summary of the experiment log for a specific candidate, including all related job information and details\nwith respect to calculated adsorption energies. Automatically fetches the latest updates from the job handler\nbefore returning: no manual update needed.\n\nDetails such as the site type, on-top element, closest neighboring elements, reduced coordination, G(O), G(OH),\nG(OOH) from the OH-OOH scaling relation, ideal overpotential, and overpotential from the scaling relation are\nprovided given the necessary calculations have finished.\n\nThree OH jobs are run per site to find the global minimum. Only the global minimum row\n(G(OH) populated) is shown once it is available.\n\nCandidate information always includes \"Reduced Formula\" (the AQ-GNoME field of the same name\nfor this candidate). For the full material-property columns (Elements, Crystal System,\nBandgap, Disorder Probability, HHI indices) available for filtering/sorting across candidates,\nuse query_explog with table_name='candidates' instead."
  "enter_candidate_in_log": "Initialize a catalyst candidate in the experiment log (EXPLOG),\nenabling it to be studied further with DFT.\n\nLooks up the candidate's structure directly from the AQ-GNoME database by MaterialId\nand initialises an OER catalyst study object."
  "submit_dft_job": "Submit a DFT job for a candidate to the HPC cluster.\n\nPrerequisites:\n    - The candidate must first be registered in EXPLOG via enter_candidate_in_log.\n    - For surface_relaxation, O_adsorption, and OH_adsorption: call\n      get_terminations_ranking and list_adsorption_sites first to identify\n      a suitable termination index and adsorption site index.\n\nOH_adsorption submits three jobs with slightly varied initial adsorbate\npositions to increase the likelihood of finding the global minimum.\n\nReturns a confirmation message including the submitted process ID(s)."
  "get_terminations_ranking": "Ranks surface terminations for a given candidate using a coordination-based\nheuristic: terminations where surface atoms retain more of their bulk\ncoordination are ranked higher (in terms of normalized score) as a proxy for stability. This is not based\non calculated surface energies — it is a heuristic guide only.\nThe score is the reduced coordination per surface area (Å⁻²) — a less negative\nscore indicates less disruption of bulk coordination, corresponding to a higher\nnormalized score.\n\nThis tool must be called before any surface relaxation or adsorption calculations.\nOnce run, the ranking is fixed and will not be recalculated on subsequent calls.\n\nOutput includes: Miller indices, termination index, normalized score, and\nexposed surface atom types. It is recommended to also call\n'list_adsorption_sites' to inspect the available adsorption sites before\ncommitting to a termination."
  "list_adsorption_sites": "This tool requires get_terminations_ranking to have been called first for the candidate.\n\nGives a preliminary list of adsorption sites if the termination has not been relaxed yet, or a list of final\nadsorption sites if the termination has been relaxed. Sites may be 'on-top' or 'lattice O', the latter being an\nexposed surface oxygen atom that is part of the lattice and may act as an adsorption site. For 'on-top' sites, the\n'element of the adsorption site' is listed, meaning the element which the adsorbate is placed on top of.\nAdditionally, a list of the closest neighboring elements of the adsorption site is given, with the distance to\nthese neighbors given as (neighbor element, distance [Å]). For 'lattice O' sites, the reduced coordination of the\nlattice O is given, which is a measure of how many neighboring atoms the lattice O has compared to a fully\ncoordinated lattice O in the bulk structure (e.g., a reduced coordination of 1 means that the lattice O atom has a\ndecreased coordination of 1.). Since this function can be called repeatedly, there is no need to write the result\nto the canvas."
  "OER_data_analasis_v2": "Get a pandas dataframe of material entries from the AQ-GNoME database that fulfill\nPourbaix stability criteria within the acidic OER operating window (pH = 0,\nU = 1.2–2.0 V vs. SHE), and save the resulting filtered dataframe to CANVAS under\nthe key specified by `save_name`.\n\nThe output dataframe contains material entries that are stable under the\nspecified conditions, with columns including: MaterialId, Composition,\nReduced Formula, Elements, Bandgap, HHI indices (availability/cost proxy),\nDisorder Probability, and max_dG_U[1.2,2.0]_pH0.\n\nThe following filters are hardcoded and always applied:\n    - Elements P, B, S, C, F are excluded.\n    - All radioactive elements are excluded.\n    - Only O-containing materials are included.\n    - Solid filter enabled: metastable solid competing phases excluded from stability comparisons.\n    - Mixed GGA/GGA(+U)/r2SCAN Pourbaix stability data.\n\nThe optional `filters` and `sort` parameters can be used to further refine\nor order the results based on the output dataframe columns. Usually only need to call this tool once at the beginning unless you want to adjust the higher level criteria and refilter the entire GNoME database."
  "browse_df": "Read and inspect a dataframe stored in CANVAS by key, with optional filtering,\nsorting, and pagination.\n\nFilters and sort are applied first to the full dataframe, then the specified\nrow window [startIdx, endIdx) is returned. This allows systematic exploration\nof large dataframes — for example, narrowing down candidates by column\nvalues without modifying the stored dataframe.\n\nUse the `filters` parameter to select rows by column value (e.g. filter by\nelement composition, HHI index, or bandgap), and `sort` to order results before\nreading. Pagination via startIdx/endIdx can then be used to step through results\nthat exceed the 50-row display limit.\n\nReturns the selected rows as a string with row index. The row index refers to\nthe position in the filtered/sorted dataframe, not the original stored dataframe."
  "write_report": "Note down intermediate/final reports"
  "search_artifacts": "Find a past artifact's result_id by content."
  "get_disposition_info": "Return a candidate's disposition status: its latest disposition (if any) and the finished\nresults that still need to be reviewed and analyzed for a disposition. You MUST call this for a candidate\nbefore update_disposition_info -- it unlocks the disposition write for that candidate."
  "update_disposition_info": "Record a disposition for a candidate: tie its finished results back to an Analysis_and_implications,\na Future_plan (the hypothesis to test next), and a Decision (one of the allowed categories in\nvar.DISPOSITION_DECISIONS). Call get_disposition_info first to see what needs analyzing. The disposition\nis recorded only once every outstanding finished result is cited; otherwise the returned message explains\nwhy and how to fix it."
