DFT_Agent:
  "math_expression_tool": "Evaluate a math expression on arbitrary input floats.\nInputs are mapped by order to x0, x1, x2, ..."
  "inspect_my_canvas": "Inspect the working canvas to get available keys"
  "read_my_canvas": "Read a value from the working canvas"
  "write_my_canvas": "Write a value to the working canvas. If the key already exists, it will not overwrite unless specified."
  "extract_numeric_from_tool_output": "Verify that a numeric value was explicitly present in the raw output of a prior tool call,\nthen register it as a trusted numeric artifact and return a result_id.\n\nArgs:\n    source_tool_call_id: The tool_call_id of the previously executed text-returning tool.\n    value: The numeric value the agent wants to extract.\n    evidence_snippet: An substring from the tool output that contains the number. \n                      To avoid ambiguate when the same number may appear multiple times.\n    description: A brief description of what this number represents. You must clarify the unit of the number in this description. \n                 e.g. 'the adsorption energy in eV', 'the length of the cell in Angstrom', etc.\n\nReturns:\n    str: A message indicating the result of the extraction and verification process."
  "extract_text_from_tool_output": " Verify that a textual span was explicitly present in the raw output of a prior tool call, then register it as a trusted text artifact and return a result_id. This tool is for TEXT only. If the agent tries to extract something that is actually a numeric value (e.g. '3.92' as a string), the tool refuses and points the agent to extract_numeric_from_tool_output. This prevents laundering numeric provenance through the text path."
  "inspect_ase_atoms": "Broad inspection tool for an ASE Atoms object.\n\nReturns a wide, agent-friendly summary of the structure, including:\n- composition\n- geometry\n- cell / PBC\n- arrays / info / constraints\n- calculator-backed results when available\n\nParameters\n----------\natoms\n    ASE Atoms object.\n\nReturns\n-------\ndict\n    JSON-serializable dictionary containing extracted information."
  "get_ase_atoms_property": "Extract one specific property from an ASE Atoms object.\n\nSupported property_name values include:\n- formula\n- natoms\n- chemical_symbols\n- atomic_numbers\n- positions\n- scaled_positions\n- cell\n- cell_lengths_and_angles\n- pbc\n- volume\n- masses\n- center_of_mass\n- momenta\n- velocities\n- tags\n- initial_charges\n- initial_magnetic_moments\n- info\n- arrays\n- constraints\n- has_calculator\n- calculator\n- potential_energy\n- forces\n- stress\n- charges\n- magnetic_moments\n\nParameters\n----------\natoms\n    ASE Atoms object.\nproperty_name : str\n    Name of the property to extract.\n\nReturns\n-------\ndict\n    JSON-serializable dictionary with the requested property."
  "init_structure_data_for_none_adsorption_calculations": "Create single element bulk initial none adsoprtion structure based for none adsoprtion studies on composite, crystal lattice, lattice info, save to the working dir, and return filename. NEVER EVER use this tool when doing adsorption analysis since this tool will not provide adsorption site information, and will not create vaccum needed for adsorption related analysis. Use generateSurface_and_getPossibleSite instead for adsorption related analysis, which generates the clean slab structure and also provides possible adsorption site information."
  "generateSurface_and_getPossibleSite": "Generate the clean slab structure and, at the same time, get the available adsorption sites. \nYou can try out different supercell_dim_z, n_fixed_layers and vacuum size to see the effect.\nHowever, only when you specify the source_result_id reference for these parameters, the result will be registered in the canvas and you can use them in the production run.\nOtherwise, the tool will still execute and return the generated surface structure and available adsorption sites, but they will not be registered and you can't use them in the production run"
  "generate_myAdsorbate": "Generate an adsorbate structure and save it."
  "add_myAdsorbate": "Add adsorbate to the surface structure and save it.\nThe third argument must be a list in the form of [[x1, y1], [x2, y2], ...], where x and y are the coordinates of the adsorption sites.\nThe forth argument must be a list of tuple in the form of [[float(angle), str(axis)], ...], where the first element is the rotation angle and the second element is the axis of rotation."
  "write_QE_script_w_ASE": "Write a Quantum Espresso input script using ASE. Bool value have no quote around them. For smearing start with methfessel-paxton. For ecutwfc choose between 30-100 Ry. When asked to run ensemble calculation, set calculation to 'ensemble'. Set calculations to 'scf' when generating template for DFT parameter convergence test and set ready_to_run_job to False,  set calculations to 'relax' when generating template for structural convergence test and set ready_to_run_job to False."
  "find_pseudopotential": "Return the pseudopotential file path for given element symbol."
  "generate_convergence_test": "Using another QE input file as a template, generate convergence test input scripts by varying ONE thing while keeping everything else the same, and save the job list. Two modes: numerical parameter sweep ('ecutwfc' / 'degauss' / 'kspacing') reuses the template structure across jobs and varies only the named DFT parameter; structural sweep ('inputAtomsDir') uses a different upstream-generated structure per job with all DFT parameters inherited from the template, and kpoints recomputed per-job from each structure's cell using the template's kspacing."
  "generate_eos_test": "From a template quantum espresso input file with production run settings, generate the equation of state test input scripts for quantum espresso calculation and save the job list."
  "get_convergence_suggestions": "Get suggestions on how to resolve issues for a certain job, i.e. converge or not accurate enough. If the output file is too long, you can call this tool multiple times for the same file with the same question but different start_block index to get suggestions based on different part of the output."
  "find_optimal_parameter": "Find the most optimal parameter value for production run. Use this tool when each data point's convergence quantity is the energy read directly from a single .pwo file"
  "find_optimal_parameter_from_derived": "Find the most optimal parameter value for production run. Use this tool for multi-step / derived-quantity convergence tests."
  "calculate_formation_E": "using the energies of the slab, adsorbate, and slab with adsorbate, calculate the formation energy of the adsorbate on the slab. "
  "calculate_lc": "Read the output file and calculate the lattice constant"
  "analyze_BEEF_result": "Read, extract, and analyze BEEF calculation results for slab, adsorbate, and surface with adsorbate. Return the mean and standard deviation of the adsorption energy."
  "add_resource_suggestion": "    After agent generate resource suggestions and submission script based on the DFT input file, add it to the json file \"resource_suggestions.json\" in the WORKING_DIRECTORY.\n    output filename must be <full input filename with extension>.<output_file_type>, \n    For example: {\"input1.pwi\": {\"nnodes\": 2, \"ntasks\": 4, \"runtime\": 60, \"submissionScript\": \"\nspack load quantum-espresso@7.2\n \n echo \"Job started on `hostname` at `date`\"\n \n mpirun pw.x -i input1.pwi > input1.pwi.pwo\n \n echo \" \"\n echo \"Job Ended at `date`\"\n    \", \"outputFilename\": \"input1.pwi.pwo\"}, \"gpawScript.py\": {\"nnodes\": 1, \"ntasks\": 1, \"runtime\": 30, \"submissionScript\": \"\necho \"Job started on `hostname` at `date`\"\n \n export GPAW_SETUP_PATH=/nfs/turbo/coe-venkvis/ziqiw-turbo/material_agent/gpaw-setups-24.11.0\n spack load py-gpaw\n \n python gpawScript.py\n echo \" \"\n echo \"Job Ended at `date`\"\n     \", \"outputFilename\": \"\"}}\n    "
  "read_energy_from_output": "Read the total energy from the output file in job list and return it in a string"
  "generate_structured_report": "Generate a structured report from (value, result_id) claims."
HPC_Agent:
  "inspect_my_canvas": "Inspect the working canvas to get available keys"
  "read_my_canvas": "Read a value from the working canvas"
