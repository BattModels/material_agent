  "submit_and_monitor_job": "Submit jobs in the job list to supercomputer, return the location of the output file once the job is done. Do not call this tool until you added the resource suggestion."
  "submit_single_job": "Submit a single job to supercomputer, return the location of the output file once the job is done"
  "math_expression_tool": "Evaluate a math expression on arbitrary input floats.\nInputs are mapped by order to x0, x1, x2, ..."
