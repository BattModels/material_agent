"FEM_Agent":
  "inspect_my_canvas": "List the keys currently on the shared CANVAS."
  "read_my_canvas": "Read the value stored on CANVAS under a key."
  "write_my_canvas": "Write a note or value to CANVAS under a key (no overwrite unless requested)."
  "write_report": "Write an intermediate/final report (markdown) to CANVAS under a new unique name, citing the reference IDs used."
  "search_artifacts": "Find a past tool result's reference ID by content (substring, number, or list of terms), optionally filtered by tool name."
  "check_time": "Report total time elapsed since the study started."
  "arXiv_search": "Search arXiv for papers matching a query and summarize them with respect to a given context question."
  "list_materials": "List the material library: role (core/cladding), refractive index at several wavelengths in the 1.3-1.6 um window, and default core height."
  "enter_design_in_log": "Enter one directional-coupler design (gap, WG1 width, WG2 width, wavelength, core/cladding materials, optional core height and explicit indices) into the EXPLOG with its hypothesis. Identical designs are refused and the existing id returned."
  "run_coupled_mode_analysis": "Run the FEM coupled-mode analysis for a design in the EXPLOG: isolated-waveguide and supermode effective indices, coupling coefficients, coupling length and maximum power transfer. Returns immediately; results recorded in the EXPLOG."
  "query_explog": "Query the EXPLOG candidates table (one row per design with parameters, latest results, the two ranking metrics coupling_length_deviation_um and excess_loss_dB (smaller is better), state, decision, needs_disposition_update) or processes table (one row per calculation with results) with filters, sorting and pagination."
  "read_explog": "Read everything the EXPLOG holds about one design: parameters, hypothesis, every calculation with results, and the latest disposition."
  "get_disposition_info": "Read a design's latest disposition and the finished results that still need analyzing. Must be called before update_disposition_info."
  "update_disposition_info": "Record a disposition for a design: Analysis_and_implications, the process ids analyzed, a Future_plan, and a Decision (Abandon, Low/Medium/High priority, Sufficient)."
