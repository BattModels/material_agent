[pytest]
# Put the repo root on sys.path so `import src.*` resolves to THIS repo's src/
# (a namespace package, no __init__.py) rather than the editable-installed
# .../GNoME_DREAMS_OER_screening/src or .../AQ-GNoME/src that are also on the
# path. Without this, bare `pytest` finds the wrong `src` and the disposition
# tests fail to import (`python -m pytest` happened to work only because -m
# prepends the cwd).
pythonpath = .
